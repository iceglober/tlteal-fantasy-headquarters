name: Snapshot and deploy

on:
  schedule:
    # Wednesday 12:00 AM Pacific. Cron is UTC-only: 07:00 UTC during PDT, 08:00 UTC during PST.
    # The script skips whichever run isn't Wednesday midnight in Los Angeles.
    - cron: "0 7 * * 3"
    - cron: "0 8 * * 3"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Take snapshot
        if: github.event_name != 'push'
        run: node scripts/snapshot.mjs ${{ github.event_name == 'schedule' && '--scheduled' || '' }}

      - name: Commit snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Weekly power rankings snapshot"
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
