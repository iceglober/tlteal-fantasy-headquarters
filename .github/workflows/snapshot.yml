name: Snapshot and deploy

on:
  schedule:
    # Thursday 12:07 AM Pacific. Cron is UTC-only: 07:07 UTC during PDT, 08:07 UTC during PST.
    # The script skips whichever run isn't Thursday in Los Angeles or finds today's snapshot already taken.
    # Off the top of the hour because GitHub delays top-of-hour scheduled runs the most.
    - cron: "7 7 * * 4"
    - cron: "7 8 * * 4"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Take snapshot
        if: github.event_name != 'push'
        run: node scripts/snapshot.mjs ${{ github.event_name == 'schedule' && '--scheduled' || '' }}

      - name: Commit snapshot
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Weekly power rankings snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Redeploy only for code pushes or a new snapshot.
      - if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v6
      - if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
