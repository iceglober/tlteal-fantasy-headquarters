<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Rankings</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #14171c; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --up: #16a34a; --down: #dc2626; --bar: #dbe4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e8eaee; --muted: #9aa1ad; --line: #262a33;
      --accent: #6b9cff; --up: #4ade80; --down: #f87171; --bar: #1f2a44;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 20px; font-size: 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tr.team { cursor: pointer; }
  tr.team:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank { font-size: 20px; font-weight: 700; width: 40px; }
  .move { font-size: 12px; font-weight: 600; width: 44px; }
  .move.up { color: var(--up); } .move.down { color: var(--down); } .move.same { color: var(--muted); }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who img, .who .ph { width: 32px; height: 32px; border-radius: 50%; flex: none; background: var(--line); }
  .who .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .who .owner { color: var(--muted); font-size: 12px; }
  .score { min-width: 120px; }
  .bar { position: relative; height: 22px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar span { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .85; }
  .bar b { position: relative; padding-left: 8px; font-size: 13px; line-height: 22px; color: var(--text); }
  .luck.pos { color: var(--up); } .luck.neg { color: var(--down); }
  tr.detail td { background: color-mix(in srgb, var(--accent) 4%, var(--card)); white-space: normal; }
  tr.detail[hidden] { display: none; }
  .lineup { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; font-size: 13px; }
  .lineup div { display: flex; justify-content: space-between; gap: 8px; }
  .lineup .slot { color: var(--muted); width: 64px; flex: none; }
  .lineup .pl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comps { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .comps b { color: var(--text); }
  .wrap { overflow-x: auto; }
  button.tip { margin-left: 4px; width: 16px; height: 16px; padding: 0; border-radius: 50%;
    border: 1px solid var(--muted); background: none; color: var(--muted); font-family: inherit; font-size: 10px; font-weight: 600; line-height: 14px;
    cursor: pointer; vertical-align: 1px; }
  button.tip:hover, button.tip:focus-visible { color: var(--accent); border-color: var(--accent); }
  #tip { position: fixed; inset: auto; margin: 0; max-width: min(300px, calc(100vw - 16px));
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: var(--text); font-size: 13px; line-height: 1.45; text-transform: none; letter-spacing: 0;
    box-shadow: 0 6px 24px rgb(0 0 0 / .18); }
  .err { padding: 24px; color: var(--down); }
  .loading { padding: 24px; color: var(--muted); }
  @media (max-width: 640px) {
    .hide-sm { display: none; }
    th, td { padding: 8px 4px; }
    th { letter-spacing: 0; }
    .rank { font-size: 16px; width: auto; }
    .move { width: auto; }
    .who { gap: 6px; }
    .who img, .who .ph { width: 24px; height: 24px; }
    .who .name { max-width: 96px; }
    .score { min-width: 56px; }
  }
</style>
</head>
<body>
<main>
  <h1 id="title">Power Rankings</h1>
  <div class="card wrap" id="out"><div class="loading">Loading…</div></div>

<div id="tip" popover="manual" role="tooltip"></div>
</main>

<script>
const DEFAULT_LEAGUE = "1407795888671207424";
const API = "https://api.sleeper.app/v1";
const POSITIONS = ["QB", "RB", "WR", "TE", "K", "DEF", "DL", "LB", "DB"];
const FLEX_ELIGIBLE = {
  FLEX: ["RB", "WR", "TE"],
  WRRB_FLEX: ["RB", "WR"],
  REC_FLEX: ["WR", "TE"],
  SUPER_FLEX: ["QB", "RB", "WR", "TE"],
  IDP_FLEX: ["DL", "LB", "DB"],
};
const NON_STARTING = new Set(["BN", "IR", "TAXI"]);
const W = { allPlay: 0.45, ppg: 0.35, winPct: 0.20 };

const params = new URLSearchParams(location.search);
const LEAGUE_ID = params.get("league") || DEFAULT_LEAGUE;

const getJSON = async (url) => {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} fetching ${url}`);
  return r.json();
};

const projURL = (season, week) => {
  const q = POSITIONS.map(p => `position[]=${p}`).join("&");
  return `https://api.sleeper.app/projections/nfl/${season}${week ? "/" + week : ""}?season_type=regular&${q}`;
};

// Fantasy points under this league's scoring rules.
function scoreStats(stats, scoring) {
  if (!stats) return 0;
  let pts = 0;
  for (const [k, v] of Object.entries(scoring)) if (stats[k]) pts += stats[k] * v;
  // Projections bucket 50+ yard FGs together; leagues may split them.
  if (stats.fgm_50p && scoring.fgm_50p == null && scoring.fgm_50_59 != null) pts += stats.fgm_50p * scoring.fgm_50_59;
  return pts;
}

// player_id -> { name, pos: [...], team, pts }
function buildProjections(weekly, season, scoring) {
  const out = {};
  for (const p of season) {
    const gp = p.stats?.gp || 0;
    if (!gp) continue;
    out[p.player_id] = playerInfo(p, scoreStats(p.stats, scoring) / gp, true);
  }
  for (const p of weekly) out[p.player_id] = playerInfo(p, scoreStats(p.stats, scoring), false);
  return out;
}
function playerInfo(p, pts, fallback) {
  const pl = p.player || {};
  const name = pl.position === "DEF" ? `${pl.team || p.player_id} D/ST` : `${pl.first_name || ""} ${pl.last_name || ""}`.trim();
  return { name, pos: pl.fantasy_positions || [pl.position], team: pl.team, pts, fallback };
}

// Fill strict slots first, then flex slots narrowest-first. Greedy is optimal for this slot shape.
function bestLineup(playerIds, slots, proj) {
  const pool = playerIds.map(id => ({ id, ...(proj[id] || { name: id, pos: [], pts: 0 }) }))
    .sort((a, b) => b.pts - a.pts);
  const used = new Set();
  const starting = slots.filter(s => !NON_STARTING.has(s));
  const strict = starting.filter(s => !FLEX_ELIGIBLE[s]);
  const flex = starting.filter(s => FLEX_ELIGIBLE[s]).sort((a, b) => FLEX_ELIGIBLE[a].length - FLEX_ELIGIBLE[b].length);
  const lineup = [];
  for (const slot of [...strict, ...flex]) {
    const ok = FLEX_ELIGIBLE[slot] || [slot];
    const pick = pool.find(p => !used.has(p.id) && p.pos.some(x => ok.includes(x)));
    if (pick) used.add(pick.id);
    lineup.push({ slot, player: pick || null });
  }
  return { lineup, total: lineup.reduce((s, l) => s + (l.player?.pts || 0), 0) };
}

const norm = (vals) => {
  const lo = Math.min(...vals), hi = Math.max(...vals);
  return vals.map(v => (hi === lo ? 0.5 : (v - lo) / (hi - lo)));
};

// Rank teams using games in `weeks` plus projected lineups `lineups` (roster_id -> total or null).
function computeRankings(rosterIds, weekly, weeks, lineups) {
  const t = Object.fromEntries(rosterIds.map(id => [id, { pf: 0, w: 0, l: 0, tie: 0, apW: 0, apG: 0, g: 0 }]));
  for (const wk of weeks) {
    const games = weekly[wk];
    const pts = games.map(m => m.points || 0);
    const byMatch = {};
    for (const m of games) (byMatch[m.matchup_id] ||= []).push(m);
    for (const m of games) {
      const s = t[m.roster_id];
      if (!s) continue;
      s.pf += m.points || 0; s.g++;
      s.apW += pts.filter(p => p < m.points).length + 0.5 * (pts.filter(p => p === m.points).length - 1);
      s.apG += pts.length - 1;
      const opp = m.matchup_id != null && byMatch[m.matchup_id].find(o => o.roster_id !== m.roster_id);
      if (opp) {
        if (m.points > opp.points) s.w++; else if (m.points < opp.points) s.l++; else s.tie++;
      }
    }
  }
  const g = weeks.length;
  const haveRoster = lineups && rosterIds.every(id => lineups[id] != null);
  const rosterW = !haveRoster ? 0 : g === 0 ? 1 : Math.max(0.25, Math.min(0.75, 0.75 - 0.07 * g));
  const rows = rosterIds.map(id => {
    const s = t[id];
    const games = s.w + s.l + s.tie;
    return {
      id, ...s,
      ppg: s.g ? s.pf / s.g : 0,
      apPct: s.apG ? s.apW / s.apG : 0,
      winPct: games ? (s.w + 0.5 * s.tie) / games : 0,
      expW: s.apG ? (s.apW / s.apG) * games : 0,
      proj: haveRoster ? lineups[id] : null,
    };
  });
  const nAp = norm(rows.map(r => r.apPct)), nPpg = norm(rows.map(r => r.ppg)), nWin = norm(rows.map(r => r.winPct));
  const nRos = haveRoster ? norm(rows.map(r => r.proj)) : rows.map(() => 0);
  rows.forEach((r, i) => {
    r.comp = { allPlay: nAp[i], ppg: nPpg[i], winPct: nWin[i], roster: nRos[i] };
    const results = W.allPlay * nAp[i] + W.ppg * nPpg[i] + W.winPct * nWin[i];
    r.score = 100 * (g ? (1 - rosterW) * results + rosterW * nRos[i] : nRos[i]);
  });
  rows.sort((a, b) => b.score - a.score || b.pf - a.pf);
  rows.forEach((r, i) => (r.rank = i + 1));
  return { rows, rosterW, g };
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = (n) => n.toFixed(1);
const pct = (n) => Math.round(n * 100) + "%";

async function main() {
  const [league, state, users, rosters] = await Promise.all([
    getJSON(`${API}/league/${LEAGUE_ID}`),
    getJSON(`${API}/state/nfl`),
    getJSON(`${API}/league/${LEAGUE_ID}/users`),
    getJSON(`${API}/league/${LEAGUE_ID}/rosters`),
  ]);
  const startWeek = league.settings.start_week || 1;
  const lastRegular = (league.settings.playoff_week_start || 15) - 1;
  const sameSeason = state.season === league.season && state.season_type === "regular";
  const seasonOver = league.status === "complete" || (state.season > league.season) || (sameSeason === false && state.season_type === "post");
  // Weeks strictly before Sleeper's current week are final.
  const lastDone = seasonOver ? lastRegular : sameSeason ? Math.min(state.week - 1, lastRegular) : startWeek - 1;
  const upcoming = !seasonOver && sameSeason && state.week <= lastRegular ? Math.max(state.week, startWeek) : null;

  const weekNums = [];
  for (let w = startWeek; w <= lastDone; w++) weekNums.push(w);
  const fetchWeeks = [...new Set([...weekNums, ...(upcoming ? [upcoming] : [])])];
  const weekly = Object.fromEntries(await Promise.all(
    fetchWeeks.map(async w => [w, await getJSON(`${API}/league/${LEAGUE_ID}/matchups/${w}`)])));
  const done = weekNums.filter(w => weekly[w].some(m => m.points > 0));

  const rosterIds = rosters.map(r => r.roster_id);
  const userById = Object.fromEntries(users.map(u => [u.user_id, u]));
  const rosterById = Object.fromEntries(rosters.map(r => [r.roster_id, r]));

  // Roster strength: this week's projections, and last week's for the "previous rank" baseline.
  const projWeeks = [upcoming, done.length ? done[done.length - 1] : null].filter(Boolean);
  let proj = {}, seasonProj = [];
  if (projWeeks.length) {
    seasonProj = await getJSON(projURL(league.season)).catch(() => []);
    const lists = await Promise.all(projWeeks.map(w => getJSON(projURL(league.season, w)).catch(() => [])));
    projWeeks.forEach((w, i) => (proj[w] = buildProjections(lists[i], seasonProj, league.scoring_settings)));
  }
  const lineupsFor = (week, currentRoster) => {
    if (!week || !proj[week]) return null;
    const out = {}, detail = {};
    for (const id of rosterIds) {
      const r = rosterById[id];
      const m = weekly[week]?.find(x => x.roster_id === id);
      let ids = (currentRoster ? r.players : m?.players) || r.players || [];
      const out_ = new Set([...(r.reserve || []), ...(r.taxi || [])]);
      if (currentRoster) ids = ids.filter(p => !out_.has(p));
      const best = bestLineup(ids, league.roster_positions, proj[week]);
      out[id] = best.total; detail[id] = best.lineup;
    }
    return { totals: out, detail };
  };

  const nowLU = lineupsFor(upcoming, true);
  const now = computeRankings(rosterIds, weekly, done, nowLU?.totals);
  let prevRank = null;
  if (done.length) {
    const prevWeek = done[done.length - 1];
    const prevLU = lineupsFor(prevWeek, false);
    const prev = computeRankings(rosterIds, weekly, done.slice(0, -1), prevLU?.totals);
    prevRank = Object.fromEntries(prev.rows.map(r => [r.id, r.rank]));
  }

  document.title = `${league.name} Power Rankings`;
  document.getElementById("title").textContent = `${league.name} Power Rankings`;
  const rw = now.rosterW, res = 1 - rw;
  const TIPS = {
    rank: "Rank by power score. Click any row to see the score breakdown and best projected lineup.",
    move: done.length ? `Change in rank since before Week ${done[done.length - 1]}.` : "Change in rank since last week.",
    team: "Team name and Sleeper owner.",
    power: `0–100. Blends four inputs, each scaled so the league's best team = 1 and worst = 0. ` +
      (now.g ? `Right now: roster strength ${pct(rw)}, all-play ${pct(res * W.allPlay)}, points per game ${pct(res * W.ppg)}, win % ${pct(res * W.winPct)}. ` : "No games played yet, so this is roster strength only. ") +
      "Roster weight starts at 75% and drops 7 points per game played, to a floor of 25%, because early results are noisy.",
    record: "Actual wins and losses.",
    allplay: "Your record if you played every team every week. Removes schedule luck.",
    ppg: "Average points scored per game.",
    luck: "Actual wins minus the wins expected from your all-play record. Positive means your schedule has helped you.",
    proj: upcoming ? `Projected points for your best possible Week ${upcoming} lineup, using Sleeper projections scored with this league's rules. Players on bye count at their season-long per-game projection.` : "No upcoming week to project.",
  };
  const th = (label, key, cls = "") => `<th class="${cls}">${label}<button class="tip" data-tip="${key}" aria-label="About ${label || "this column"}">?</button></th>`;

  const team = (id) => {
    const r = rosterById[id], u = userById[r.owner_id] || {};
    const name = u.metadata?.team_name || u.display_name || `Team ${id}`;
    const avatar = u.metadata?.avatar || (u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null);
    return { name, owner: u.display_name || "Open", avatar };
  };

  const head = `<thead><tr>
    ${th("#", "rank")}${th("", "move")}${th("Team", "team")}${th("Power", "power", "score")}
    ${th("Record", "record", "num")}${th("All-play", "allplay", "num hide-sm")}${th("PPG", "ppg", "num hide-sm")}
    ${th("Luck", "luck", "num hide-sm")}${th("Proj", "proj", "num hide-sm")}</tr></thead>`;
  const body = now.rows.map(r => {
    const tm = team(r.id);
    const d = prevRank ? prevRank[r.id] - r.rank : 0;
    const move = !prevRank ? "" : d > 0 ? `<span class="move up">▲${d}</span>` : d < 0 ? `<span class="move down">▼${-d}</span>` : `<span class="move same">–</span>`;
    const luck = r.w + 0.5 * r.tie - r.expW;
    const rec = `${r.w}-${r.l}${r.tie ? "-" + r.tie : ""}`;
    const ap = `${f1(r.apW).replace(/\.0$/, "")}-${f1(r.apG - r.apW).replace(/\.0$/, "")}`;
    const img = tm.avatar ? `<img src="${esc(tm.avatar)}" alt="" loading="lazy">` : `<span class="ph"></span>`;
    const lineup = nowLU?.detail[r.id] || [];
    const lineupHtml = lineup.map(l => `<div><span class="slot">${esc(l.slot.replace("_", " "))}</span>
      <span class="pl">${l.player ? esc(l.player.name) + (l.player.fallback ? " (bye)" : "") : "—"}</span>
      <span>${l.player ? f1(l.player.pts) : "0.0"}</span></div>`).join("");
    const c = r.comp;
    return `<tr class="team" data-id="${r.id}">
      <td class="rank">${r.rank}</td><td class="move">${move}</td>
      <td><div class="who">${img}<div><div class="name">${esc(tm.name)}</div>${tm.owner !== tm.name ? `<div class="owner">${esc(tm.owner)}</div>` : ""}</div></div></td>
      <td class="score"><div class="bar"><span style="width:${r.score.toFixed(1)}%"></span><b>${f1(r.score)}</b></div></td>
      <td class="num">${rec}</td><td class="num hide-sm">${ap}</td><td class="num hide-sm">${f1(r.ppg)}</td>
      <td class="num hide-sm luck ${luck > 0.05 ? "pos" : luck < -0.05 ? "neg" : ""}">${luck > 0 ? "+" : ""}${f1(luck)}</td>
      <td class="num hide-sm">${r.proj != null ? f1(r.proj) : "—"}</td></tr>
      <tr class="detail" data-for="${r.id}" hidden><td colspan="9">
        <div class="comps">
          <span>All-play <b>${pct(c.allPlay)}</b></span><span>PPG <b>${pct(c.ppg)}</b></span>
          <span>Win % <b>${pct(c.winPct)}</b></span><span>Roster <b>${pct(c.roster)}</b></span>
          <span>Record ${rec} · All-play ${ap} · PF ${f1(r.pf)} · Luck ${luck > 0 ? "+" : ""}${f1(luck)}</span>
        </div>
        ${lineup.length ? `<div class="comps"><b>Best projected lineup, Week ${upcoming}: ${f1(r.proj)} pts</b></div><div class="lineup">${lineupHtml}</div>` : ""}
      </td></tr>`;
  }).join("");
  const out = document.getElementById("out");
  out.innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
  const tip = document.getElementById("tip");
  const hideTip = () => tip.matches(":popover-open") && tip.hidePopover();
  document.addEventListener("click", (e) => { if (!e.target.closest("#tip, button.tip")) hideTip(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
  addEventListener("scroll", hideTip, true);
  out.addEventListener("click", (e) => {
    const btn = e.target.closest("button.tip");
    if (btn) {
      e.stopPropagation();
      const same = tip.matches(":popover-open") && tip.dataset.key === btn.dataset.tip;
      hideTip();
      if (same) return;
      tip.dataset.key = btn.dataset.tip;
      tip.textContent = TIPS[btn.dataset.tip];
      tip.showPopover();
      const b = btn.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
      const left = Math.max(8, Math.min(b.left + b.width / 2 - w / 2, innerWidth - w - 8));
      const top = b.bottom + 6 + h > innerHeight - 8 ? b.top - h - 6 : b.bottom + 6;
      tip.style.left = `${left}px`; tip.style.top = `${top}px`;
      return;
    }
    const tr = e.target.closest("tr.team");
    if (!tr) return;
    const d = out.querySelector(`tr.detail[data-for="${tr.dataset.id}"]`);
    d.hidden = !d.hidden;
  });
}

main().catch(err => {
  console.error(err);
  document.getElementById("out").innerHTML = `<div class="err">Couldn't load league data: ${esc(err.message)}</div>`;
});
</script>
</body>
</html>
