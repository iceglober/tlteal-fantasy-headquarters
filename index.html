<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLTEAL Headquarters</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #14171c; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --up: #16a34a; --warn: #b45309; --down: #dc2626; --bar: #dbe4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e8eaee; --muted: #9aa1ad; --line: #262a33;
      --accent: #6b9cff; --up: #4ade80; --warn: #fbbf24; --down: #f87171; --bar: #1f2a44;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 28px; }
  #updated { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tr.team { cursor: pointer; }
  tr.team:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank { font-size: 20px; font-weight: 700; width: 40px; }
  .move { font-size: 12px; font-weight: 600; width: 44px; }
  .move.up { color: var(--up); } .move.down { color: var(--down); } .move.same { color: var(--muted); }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who img, .who .ph { width: 32px; height: 32px; border-radius: 50%; flex: none; background: var(--line); }
  .who .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .who .owner { color: var(--muted); font-size: 12px; }
  .score { min-width: 120px; }
  .bar { position: relative; height: 22px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar span { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .85; }
  .bar b { position: relative; padding-left: 8px; font-size: 13px; line-height: 22px; color: var(--text); }
  .luck.pos { color: var(--up); } .luck.neg { color: var(--down); }
  tr.detail td { background: color-mix(in srgb, var(--accent) 4%, var(--card)); white-space: normal; }
  tr.detail[hidden] { display: none; }
  .lineup { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; font-size: 13px; }
  .lineup div { display: flex; justify-content: space-between; gap: 8px; }
  .lineup .slot { color: var(--muted); width: 64px; flex: none; }
  .lineup .pl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comps { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .comps b { color: var(--text); }
  .show-sm, .show-sm-inline { display: none; }
  .dict { margin-top: 24px; font-size: 13px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  #report-table td:last-child { white-space: normal; color: var(--muted); font-size: 13px; }
  .status { font-weight: 700; }
  .status.Active { color: var(--up); } .status.Questionable { color: var(--warn); } .status.Doubtful { color: var(--down); }
  .dict td { white-space: normal; vertical-align: top; }
  .dict .nw { white-space: nowrap; }
  .dict td:first-child { white-space: nowrap; font-weight: 600; }
  table.parts { width: auto; margin-bottom: 14px; font-size: 13px; }
  table.parts td.num { white-space: nowrap; }
  table.parts th, table.parts td { padding: 4px 16px 4px 0; border-bottom: 1px solid var(--line); }
  table.parts th { text-transform: none; letter-spacing: 0; font-size: 12px; }
  table.parts td.num, table.parts th.num { padding-left: 12px; }
  .wrap { overflow-x: auto; }
  button.tip { position: relative; margin-left: 4px; width: 16px; height: 16px; padding: 0; border-radius: 50%;
    border: 1px solid var(--muted); background: none; color: var(--muted); font-family: inherit; font-size: 10px; font-weight: 600; line-height: 14px;
    cursor: pointer; vertical-align: 1px; }
  button.tip:hover, button.tip:focus-visible { color: var(--accent); border-color: var(--accent); }
  #tip { position: fixed; inset: auto; margin: 0; max-width: min(300px, calc(100vw - 16px));
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: var(--text); font-size: 13px; line-height: 1.45; text-transform: none; letter-spacing: 0;
    box-shadow: 0 6px 24px rgb(0 0 0 / .18); }
  .err { padding: 24px; color: var(--down); }
  .loading { padding: 24px; color: var(--muted); }
  /* Bigger tap area than the visible circle. */
  button.tip::after { content: ""; position: absolute; inset: -8px; }
  .rec-sm { display: none; }
  @media (max-width: 640px) {
    .rec-sm { display: inline; color: var(--text); font-weight: 600; }
    #report-table thead { display: none; }
    #report-table tr { display: grid; grid-template-columns: 1fr auto; border-bottom: 1px solid var(--line); }
    #report-table td { border: 0; padding: 8px 12px 2px; }
    #report-table td:last-child { grid-column: 1 / -1; padding: 0 12px 8px; }
    .dict td { display: block; border: 0; padding: 2px 0; }
    .dict tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .dict .nw { white-space: normal; }
    .hide-sm { display: none; }
    .show-sm { display: flex; }
    .show-sm-inline { display: inline; color: var(--text); }
    table.parts th, table.parts td { padding-right: 6px; }
    table.parts td.num, table.parts th.num { padding-left: 6px; }
    th, td { padding: 8px 4px; }
    th { letter-spacing: 0; }
    .rank { font-size: 16px; width: auto; }
    .move { width: auto; }
    .who { gap: 6px; }
    .who img, .who .ph { width: 24px; height: 24px; }
    .who .name { max-width: 96px; }
    .score { min-width: 56px; }
  }
</style>
</head>
<body>
<main>
  <header><h1 id="title">TLTEAL Headquarters</h1><span id="updated"></span></header>
  <nav class="tabs" role="tablist">
    <a href="#rankings" role="tab" data-tab="rankings">Power Rankings</a>
    <a href="#managers" role="tab" data-tab="managers">Manager Report</a>
  </nav>
  <section id="panel-rankings" class="panel">
    <div class="card wrap" id="out"><div class="loading">Loading…</div></div>
    <table class="dict" id="dict-rankings"></table>
  </section>
  <section id="panel-managers" class="panel" hidden>
    <div class="card"><table id="report-table"><tr><td>No manager report yet.</td></tr></table></div>
    <table class="dict" id="dict-managers"></table>
  </section>
<div id="tip" popover="manual" role="tooltip"></div>
</main>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = (n) => n.toFixed(1);
const pct = (n) => Math.round(n * 100) + "%";
const trim0 = (n) => f1(n).replace(/\.0$/, "");

async function main() {
  const r = await fetch(`data/latest.json?t=${Date.now()}`);
  if (!r.ok) throw new Error(`${r.status} loading rankings`);
  const snap = await r.json();
  const { weights: wt, projWeek, asOfWeek, prevWeek } = snap;

  document.title = `${snap.league.name} Headquarters`;
  document.getElementById("title").textContent = `${snap.league.name} Headquarters`;
  const updated = new Date(snap.generatedAt).toLocaleString("en-US", {
    timeZone: "America/Los_Angeles", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short",
  });
  document.getElementById("updated").textContent = `Updated ${updated}`;
  const projLabel = projWeek ? `Wk ${projWeek} Proj` : "Proj";
  const wk = projWeek ?? "–";
  const TIPS = {
    rank: `Updates every Thursday around 12 AM PT. Click a team for details.`,
    move: "Spots moved since last week.",
    team: "Team and owner.",
    power: "Overall score, 0–100. Formula is below the table.",
    record: "Wins and losses.",
    allplay: "Your record if you played every team every week. 6-3 = you outscored 6 of 9 teams.",
    ppg: "Points per game.",
    luck: "Real wins minus the wins your All-Play record says you deserve. Plus = easy schedule.",
    status: "Is this manager still running their team? Judgment calls don't count, only missed byes, injuries, and obvious blunders.",
    strikes: "Strikes in the last 4 weeks. See definitions below.",
    proj: projWeek ? `Your best lineup's projected points for Week ${wk}.` : "No game to project.",
  };
  // Points = weight × 100 × where the team sits between the league's worst (0) and best (1) on that input.
  const INPUTS = [
    { key: "roster", label: "Current Week Projection", value: t => t.proj != null ? f1(t.proj) : "—" },
    { key: "allPlay", label: "All-Play", value: t => `${trim0(t.apW)}-${trim0(t.apL)}` },
    { key: "ppg", label: "PPG", value: t => f1(t.ppg) },
    { key: "winPct", label: "Wins", value: t => `${t.w}-${t.l}${t.tie ? "-" + t.tie : ""}` },
  ];
  const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
  const leagueRank = (key, t) => {
    const above = snap.teams.filter(o => o.comp[key] > t.comp[key]).length;
    const tied = snap.teams.filter(o => o.comp[key] === t.comp[key]).length > 1;
    return `${tied ? "T-" : ""}${ordinal(above + 1)}`;
  };
  const dec = (n) => n.toFixed(2).replace(/^0/, "");
  const formula = INPUTS.filter(i => wt[i.key] > 0).map(i => `<span class="nw">(${i.label} × ${dec(wt[i.key])})</span>`).join(" + ");
  const th = (label, key, cls = "") => `<th class="${cls}">${label}<button class="tip" data-tip="${key}" aria-label="About ${label || "this column"}">?</button></th>`;
  const SEVERITY = { Doubtful: 0, Questionable: 1, Active: 2 };
  const report = snap.teams.filter(t => t.engagement?.byWeek)
    .sort((a, b) => SEVERITY[a.engagement.status] - SEVERITY[b.engagement.status] || a.rank - b.rank);
  if (report.length) {
    const rows = report.map(t => {
      const e = t.engagement;
      const trend = e.byWeek.length > 1
        ? `Strikes by week: ${e.byWeek.map(x => x.strikes).join(" · ")} · Season: ${e.season} in ${e.byWeek.length} weeks`
        : null;
      const strikesSm = `<span class="show-sm-inline">${e.strikes} strike${e.strikes === 1 ? "" : "s"}${e.reasons.length || trend ? " · " : ""}</span>`;
      const notes = [...e.reasons, trend].filter(Boolean).map(esc).join(" · ");
      return `<tr><td>${esc(t.name)}</td><td class="status ${e.status}">${e.status}</td>
        <td class="num hide-sm">${e.strikes}</td><td>${strikesSm}${notes}</td></tr>`;
    }).join("");
    document.getElementById("report-table").innerHTML =
      `<thead><tr><th>Team</th>${th("Status", "status")}${th("Strikes", "strikes", "num")}<th>Notes</th></tr></thead><tbody>${rows}</tbody>`;
  }
  const dict = (rows) => rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  document.getElementById("dict-rankings").innerHTML = dict([
    ["Power", formula],
    ["Current Week Projection", `Projected fantasy points for your best lineup in Week ${wk}`],
    ["All-Play", "Record if you had played every other team, every week this season"],
    ["PPG", "Average points per game"],
    ["Wins", "Total real wins (not All-Play)"],
    ["Scoring", "Each Power item is scored 0–100 against the league: best team = 100, worst = 0"],
    ["Luck", "Wins minus expected wins from All-Play (e.g. 1 game at 6-3 All-Play = 0.67 expected). Plus = lucky schedule. Not part of Power"],
  ].map(([k, v], i) => [k, i ? esc(v) : v]));
  document.getElementById("dict-managers").innerHTML = dict([
    ["Strike", "Started a player on bye or ruled out, left a slot empty, benched someone projected 10+ points better, or went 3 weeks without touching lineup or roster"],
    ["Active", "0 strikes in the last 4 weeks"],
    ["Questionable", "1 strike in the last 4 weeks"],
    ["Doubtful", "2+ strikes in the last 4 weeks"],
  ].map(([k, v]) => [k, esc(v)]));
  const head = `<thead><tr>
    ${th("#", "rank")}${th("", "move")}${th("Team", "team")}${th("Power", "power", "score")}
    ${th("Record", "record", "num hide-sm")}${th("All-Play", "allplay", "num hide-sm")}${th("PPG", "ppg", "num hide-sm")}
    ${th("Luck", "luck", "num hide-sm")}${th(projLabel, "proj", "num hide-sm")}</tr></thead>`;
  const body = snap.teams.map(t => {
    const d = t.prevRank == null ? null : t.prevRank - t.rank;
    const move = d == null ? "" : d > 0 ? `<span class="move up">▲${d}</span>` : d < 0 ? `<span class="move down">▼${-d}</span>` : `<span class="move same">–</span>`;
    const rec = `${t.w}-${t.l}${t.tie ? "-" + t.tie : ""}`;
    const ap = `${trim0(t.apW)}-${trim0(t.apL)}`;
    const luck = `${t.luck > 0 ? "+" : ""}${f1(t.luck)}`;
    const img = t.avatar ? `<img src="${esc(t.avatar)}" alt="" loading="lazy">` : `<span class="ph"></span>`;
    const lineupHtml = t.lineup.map(l => `<div><span class="slot">${esc(l.slot.replace("_", " "))}</span>
      <span class="pl">${l.name ? esc(l.name) + (l.bye ? " (bye)" : "") : "—"}</span>
      <span>${f1(l.pts)}</span></div>`).join("");
    const parts = INPUTS.filter(i => wt[i.key] > 0).sort((a, b) => wt[b.key] - wt[a.key]).map(i => `<tr>
      <td>${i.label}</td><td class="num">${i.value(t)}</td><td class="num">${leagueRank(i.key, t)}</td>
      <td class="num hide-sm">${pct(wt[i.key])}</td><td class="num"><b>${f1(100 * wt[i.key] * t.comp[i.key])}</b></td></tr>`).join("");
    return `<tr class="team" data-id="${t.id}">
      <td class="rank">${t.rank}</td><td class="move">${move}</td>
      <td><div class="who">${img}<div><div class="name">${esc(t.name)}</div><div class="owner"><span class="rec-sm">${rec}${t.owner !== t.name ? " · " : ""}</span>${t.owner !== t.name ? esc(t.owner) : ""}</div></div></div></td>
      <td class="score"><div class="bar"><span style="width:${t.score}%"></span><b>${f1(t.score)}</b></div></td>
      <td class="num hide-sm">${rec}</td><td class="num hide-sm">${ap}</td><td class="num hide-sm">${f1(t.ppg)}</td>
      <td class="num hide-sm luck ${t.luck > 0 ? "pos" : t.luck < 0 ? "neg" : ""}">${luck}</td>
      <td class="num hide-sm">${t.proj != null ? f1(t.proj) : "—"}</td></tr>
      <tr class="detail" data-for="${t.id}" hidden><td colspan="9">
        <table class="parts">
          <thead><tr><th>Power ${f1(t.score)} =</th><th class="num">Value</th><th class="num">Rank</th><th class="num hide-sm">Weight</th><th class="num">Points</th></tr></thead>
          <tbody>${parts}</tbody>
        </table>
        <div class="comps show-sm">Luck <b>${luck}</b></div>
        ${t.lineup.length ? `<div class="comps"><b>Best Week ${projWeek} lineup: ${f1(t.proj)} pts</b></div><div class="lineup">${lineupHtml}</div>` : ""}
      </td></tr>`;
  }).join("");
  const out = document.getElementById("out");
  out.innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
  const tip = document.getElementById("tip");
  const hideTip = () => tip.matches(":popover-open") && tip.hidePopover();
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("button.tip");
    if (!btn) { if (!e.target.closest("#tip")) hideTip(); return; }
    const same = tip.matches(":popover-open") && tip.dataset.key === btn.dataset.tip;
    hideTip();
    if (same) return;
    tip.dataset.key = btn.dataset.tip;
    tip.textContent = TIPS[btn.dataset.tip];
    tip.showPopover();
    const b = btn.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    const left = Math.max(8, Math.min(b.left + b.width / 2 - w / 2, innerWidth - w - 8));
    const top = b.bottom + 6 + h > innerHeight - 8 ? b.top - h - 6 : b.bottom + 6;
    tip.style.left = `${left}px`; tip.style.top = `${top}px`;
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
  addEventListener("scroll", hideTip, true);
  out.addEventListener("click", (e) => {
    if (e.target.closest("button.tip")) return;
    const tr = e.target.closest("tr.team");
    if (!tr) return;
    const d = out.querySelector(`tr.detail[data-for="${tr.dataset.id}"]`);
    d.hidden = !d.hidden;
  });
}

// Tabs: the URL hash picks the tab, so #managers links straight to the manager report.
function showTab() {
  const tab = location.hash === "#managers" ? "managers" : "rankings";
  for (const p of document.querySelectorAll(".panel")) p.hidden = p.id !== `panel-${tab}`;
  for (const a of document.querySelectorAll(".tabs a")) a.setAttribute("aria-selected", a.dataset.tab === tab);
}
addEventListener("hashchange", showTab);
showTab();

main().catch(err => {
  console.error(err);
  document.getElementById("out").innerHTML = `<div class="err">Couldn't load league data: ${esc(err.message)}</div>`;
});
</script>
</body>
</html>
